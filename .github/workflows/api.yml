name: API

# Solo corre cuando cambia la API o este mismo archivo (ADR-0001).
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/api.yml

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formato, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    # PostgreSQL real para las pruebas de integración (ADR-0018). Corre en
    # los servidores de GitHub; gratis en repositorios públicos.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anfybio
          POSTGRES_PASSWORD: anfybio
          POSTGRES_DB: anfybio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anfybio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://anfybio:anfybio@localhost:5432/anfybio_test
      JWT_SECRET: clave-de-ci-solo-para-pruebas-de-integracion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de integración
        run: npm run test:e2e

      - name: Compilación
        run: npm run build
